name: Compilar

# Verifica que el proyecto compile y que las pruebas pasen en cada push y
# pull request. Para impedir el merge de codigo roto, marca el check
# "Compilar" como obligatorio en Settings > Branches > Branch protection rules.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y probar con Maven
        run: mvn -B -ntp verify
